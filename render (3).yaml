services:
  - type: web
    name: apnavault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: STORAGE
        value: telegram
      - key: COOKIE_SECURE
        value: "1"
